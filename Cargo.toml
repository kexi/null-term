[workspace]
resolver = "3"
members = ["crates/core", "crates/cli", "crates/web"]
# `cargo build` は native 版だけ。ブラウザ版は crates/web で trunk build する
default-members = ["crates/core", "crates/cli"]

[workspace.package]
version = "1.10.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
null-term-core = { path = "crates/core" }
anyhow = "1.0.104"
encoding_rs = "0.8.42"
# ratzilla 0.3 が ratatui 0.30 を要求するので CLI もこれに揃える
ratatui = { version = "0.30", default-features = false, features = ["std", "layout-cache"] }
vt100 = "0.15"
web-time = "1.1"

[profile.release]
# wasm のサイズを抑える (CLI にも効くが実害はない)
lto = true
