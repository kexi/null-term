# ブラウザ版 (crates/web) を GitHub Pages に公開する
name: Pages

on:
  push:
    # web-serial は main にマージするまでの暫定 (マージ後に外す)
    branches: [main, web-serial]
    paths:
      - "crates/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # ローカルと同じ nix develop の環境 (wasm32 ターゲット + trunk) でビルドする
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Test core
        run: nix develop --command cargo test -p null-term-core
      - name: Build
        working-directory: crates/web
        # Pages は https://<owner>.github.io/<repo>/ で配信される
        run: nix develop ../.. --command trunk build --release --public-url "/${GITHUB_REPOSITORY#*/}/"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: crates/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
